services:
  postgres:
    image: ankane/pgvector:latest
    restart: unless-stopped

    environment:
      POSTGRES_DB: allyai
      POSTGRES_USER: allyai
      POSTGRES_PASSWORD: allyai

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allyai -d allyai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    volumes:
      - ./backend:/app/backend
      - ./knowledge:/app/knowledge

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: allyai
      POSTGRES_USER: allyai
      POSTGRES_PASSWORD: allyai
      APPOINTMENT_SERVICE_URL: http://appointment:8081

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      appointment:
        condition: service_started

  appointment:
    build:
      context: ./services/appointment
      dockerfile: Dockerfile

    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: allyai-frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      NODE_ENV: development

    command: npm run dev

    depends_on:
      - postgres

volumes:
  pgdata: